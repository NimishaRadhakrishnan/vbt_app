worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # ------------------------------------------------------------------
    # The real client's address, when Cloudflare is in front
    # ------------------------------------------------------------------
    # Without this every request arrives from a Cloudflare address, so:
    #
    #   * the rate-limit zone below becomes ONE bucket for the whole
    #     internet - 20r/s shared by every officer in the company;
    #   * X-Forwarded-For handed to the backend is Cloudflare's, so the
    #     login backstop locks out everybody after 100 failures from anyone;
    #   * every access-log line names Cloudflare instead of the user.
    #
    # `real_ip_header CF-Connecting-IP` is the header Cloudflare sets and
    # overwrites on every request, so a client cannot forge it. It is only
    # believed from the ranges listed below - that is what makes it safe.
    #
    # THESE RANGES CHANGE. Refresh them at deploy time:
    #   curl -s https://www.cloudflare.com/ips-v4
    #   curl -s https://www.cloudflare.com/ips-v6
    # (list current as of September 2026)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ------------------------------------------------------------------
    # WebSocket upgrade, correctly
    # ------------------------------------------------------------------
    # The app opens a WebSocket at /api/v1/ws/alerts. Sending
    # `Connection: upgrade` on EVERY /api/ request - which the previous
    # version of this file did - is wrong: an ordinary JSON request then
    # carries an upgrade instruction it never asked for, and keep-alive to
    # the upstream is disabled for all of them. This map sends `upgrade`
    # only when the client actually asked to upgrade, and `close` otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Per-client request rate at the edge, on top of the application's own
    # login limiter. Keyed on $binary_remote_addr, which - thanks to the
    # real_ip block above - is now the officer's address and not Cloudflare's.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Officers upload crop and farm photos straight from a phone camera.
    # Nginx's default body limit is 1 MB, which rejects a normal photo with a
    # 413 the app cannot explain. 25 MB covers a full-resolution image with
    # room to spare.
    client_max_body_size 25m;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    # The server blocks live in conf.d, written by the image's entrypoint from
    # infra/nginx/templates/app.conf.template with ${SERVER_NAME} substituted.
    # That keeps the domain in one environment variable instead of being
    # hand-edited into a config file on the server.
    include /etc/nginx/conf.d/*.conf;
}
